name: CI

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: lint, type-check, and unit tests (integration tests excluded so the
  # heavy build123d/OpenCASCADE stack is not exercised here). Mirrors the compose
  # `checks` service (`ruff check src tests && mypy && pytest -q`).
  checks:
    name: ruff + mypy + pytest (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type-check (mypy)
        run: mypy

      - name: Unit tests (pytest)
        run: pytest -q -m "not integration"

  # Integration tests need the full CAD stack. Kept in a separate job so a failure or
  # slowdown here does not block the fast `checks` gate. Runs on push/PR to prod.
  integration:
    name: pytest (integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      # OpenCASCADE (OCP) needs a few shared X/GL libs at runtime even when headless.
      # These mirror the runtime libraries installed in docker/Dockerfile.
      - name: Install OpenCASCADE runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libx11-6 libxext6 libxrender1 \
            libxi6 libsm6 libice6 libfontconfig1 libgomp1

      - name: Integration tests (pytest)
        env:
          MPLBACKEND: Agg
        run: pytest -q -m integration

  # Build the Docker image to catch Dockerfile breakage. Build only, no push.
  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: false
          tags: anvil:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
