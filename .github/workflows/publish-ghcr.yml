name: Publish image to GHCR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v0.1.0). Also tagged as latest."
        required: true
        type: string

# GITHUB_TOKEN needs write access to publish packages to GHCR. No extra secret required.
permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build + push (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU enables cross-building the linux/arm64 image on the amd64 runner.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image name is derived from the repo (owner/name), lowercased for GHCR.
      - name: Compute image name and tag
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ref_tag="${{ inputs.tag }}"
          else
            ref_tag="${GITHUB_REF_NAME}"
          fi
          {
            echo "image=${image}"
            echo "tags=${image}:${ref_tag},${image}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
