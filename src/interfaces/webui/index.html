<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anvil · Design</title>
    <style>
      :root {
        --bg: #0e0f12;
        --panel: #16181d;
        --line: #262a31;
        --ink: #e7e9ee;
        --dim: #8b909a;
        --accent: #6ea8fe;
        --ok: #4ade80;
        --bad: #f87171;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
        font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
      body { display: grid; grid-template-columns: minmax(0, 1fr) 360px; height: 100vh; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }

      /* --- Left: conversation --- */
      #main { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
      header { display: flex; align-items: baseline; gap: 12px; padding: 14px 18px;
        border-bottom: 1px solid var(--line); }
      header h1 { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
        margin: 0; font-weight: 600; }
      header .sid { color: var(--dim); font-size: 12px; }
      header .spacer { flex: 1; }

      #log { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex;
        flex-direction: column; gap: 10px; }
      .msg { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
        background: var(--panel); max-width: 80%; white-space: pre-wrap; word-break: break-word; }
      .msg.you { align-self: flex-end; border-color: #2f3a4d; }
      .msg.agent { align-self: flex-start; }
      .msg .who { color: var(--dim); font-size: 11px; letter-spacing: 0.08em;
        text-transform: uppercase; margin-bottom: 4px; }

      .tool { align-self: flex-start; max-width: 80%; font-size: 12px; color: var(--dim);
        border: 1px dashed var(--line); border-radius: 8px; padding: 6px 10px; background: #12141a; }
      .tool .name { color: var(--accent); }
      .tool.result .ok { color: var(--ok); }
      .tool.result .bad { color: var(--bad); }
      .tool details { margin-top: 4px; }
      .tool summary { cursor: pointer; }
      .tool pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word;
        color: var(--dim); max-height: 160px; overflow: auto; }

      .note { align-self: center; color: var(--dim); font-size: 12px; }

      #composer { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
      #input { flex: 1; resize: none; background: var(--panel); color: var(--ink);
        border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font: inherit;
        min-height: 40px; max-height: 140px; }
      #input:focus { outline: none; border-color: var(--accent); }
      button { background: var(--panel); color: var(--ink); border: 1px solid var(--line);
        border-radius: 8px; padding: 8px 14px; cursor: pointer; font: inherit; }
      button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
      button:disabled { opacity: 0.45; cursor: default; }

      /* --- Right: state panel --- */
      #side { overflow-y: auto; background: #101216; display: flex; flex-direction: column; }
      section { border-bottom: 1px solid var(--line); padding: 14px 16px; }
      section h2 { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--dim); margin: 0 0 10px; font-weight: 600; }
      .kv { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
      .kv span:first-child { color: var(--dim); }
      .taglist { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
      .tag { border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; font-size: 11px;
        color: var(--dim); }
      .empty { color: var(--dim); font-size: 12px; }

      .part { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 8px;
        background: var(--panel); }
      .part .pid { color: var(--accent); font-size: 12px; }
      .part .dims { color: var(--dim); font-size: 12px; margin: 2px 0 6px; }
      .renders { display: flex; gap: 6px; flex-wrap: wrap; }
      .renders img { width: 68px; height: 68px; object-fit: cover; border: 1px solid var(--line);
        border-radius: 6px; background: #000; }
      .links { display: flex; gap: 10px; margin-top: 6px; font-size: 12px; }

      #viewer-wrap { flex: 1; min-height: 260px; display: flex; flex-direction: column; }
      #viewer-wrap iframe { flex: 1; width: 100%; border: 0; background: #000; }
    </style>
  </head>
  <body>
    <div id="main">
      <header>
        <h1>Anvil</h1>
        <span class="sid" id="sid">no session</span>
        <span class="spacer"></span>
        <button id="new-btn" title="Start a fresh session">New session</button>
      </header>
      <div id="log"></div>
      <div id="composer">
        <textarea id="input" placeholder="Describe a part — e.g. a 30.5mm drone motor mount for a 2207 motor, M3 bolts, PETG…"></textarea>
        <button id="send-btn">Send</button>
      </div>
    </div>

    <aside id="side">
      <section id="spec-section">
        <h2>Design spec</h2>
        <div id="spec"><div class="empty">No spec agreed yet.</div></div>
      </section>
      <section id="parts-section">
        <h2>Parts &amp; exports</h2>
        <div id="parts"><div class="empty">Nothing built yet.</div></div>
      </section>
      <div id="viewer-wrap"></div>
    </aside>

    <script>
      const VIEWER_URL = "{{VIEWER_URL}}";
      const log = document.getElementById("log");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send-btn");
      const newBtn = document.getElementById("new-btn");
      const sidEl = document.getElementById("sid");
      let sessionId = null;
      let busy = false;

      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }

      function scrollLog() { log.scrollTop = log.scrollHeight; }

      function addMessage(who, text) {
        const box = el("div", `msg ${who === "you" ? "you" : "agent"}`);
        box.appendChild(el("div", "who", who));
        box.appendChild(el("div", null, text));
        log.appendChild(box);
        scrollLog();
        return box.lastChild;
      }

      function addNote(text) { log.appendChild(el("div", "note", text)); scrollLog(); }

      function addToolCall(name, args) {
        const box = el("div", "tool call");
        const line = el("span");
        line.innerHTML = `→ <span class="name">${name}</span>`;
        box.appendChild(line);
        const keys = Object.keys(args || {});
        if (keys.length) {
          const det = el("details");
          det.appendChild(el("summary", null, `${keys.length} argument${keys.length > 1 ? "s" : ""}`));
          det.appendChild(el("pre", null, JSON.stringify(args, null, 2)));
          box.appendChild(det);
        }
        log.appendChild(box);
        scrollLog();
      }

      function addToolResult(ok, text) {
        const box = el("div", "tool result");
        const head = el("span");
        head.innerHTML = ok ? `<span class="ok">✓ ok</span>` : `<span class="bad">✗ failed</span>`;
        box.appendChild(head);
        if (text) {
          const det = el("details");
          det.appendChild(el("summary", null, "output"));
          det.appendChild(el("pre", null, text));
          box.appendChild(det);
        }
        log.appendChild(box);
        scrollLog();
      }

      async function newSession() {
        const res = await fetch("/api/v1/sessions", { method: "POST" });
        if (!res.ok) { addNote("could not create a session"); return; }
        const data = await res.json();
        sessionId = data.session_id;
        sidEl.textContent = sessionId;
        log.innerHTML = "";
        addNote("Session ready. Describe what you want to build.");
        renderState({ spec: null, artifacts: [], exports: [] });
        mountViewer();
      }

      function mountViewer() {
        const wrap = document.getElementById("viewer-wrap");
        wrap.innerHTML = "";
        if (!VIEWER_URL || !sessionId) return;
        const sep = VIEWER_URL.includes("?") ? "&" : "?";
        const frame = el("iframe");
        frame.src = `${VIEWER_URL}${sep}session=${encodeURIComponent(sessionId)}`;
        frame.title = "Live 3D viewer";
        const bar = el("section");
        bar.style.borderTop = "1px solid var(--line)";
        const h = el("h2", null, "Live 3D viewer");
        const link = el("a", null, "open full");
        link.href = frame.src; link.target = "_blank";
        link.style.float = "right"; link.style.textTransform = "none"; link.style.letterSpacing = "0";
        h.appendChild(link);
        bar.appendChild(h);
        wrap.appendChild(bar);
        wrap.appendChild(frame);
      }

      async function send() {
        const text = input.value.trim();
        if (!text || busy || !sessionId) return;
        busy = true;
        sendBtn.disabled = true;
        input.value = "";
        addMessage("you", text);

        const url = `/api/v1/sessions/${sessionId}/stream?text=${encodeURIComponent(text)}`;
        const es = new EventSource(url);

        es.addEventListener("assistant", (ev) => addMessage("agent", JSON.parse(ev.data).text));
        es.addEventListener("tool_call", (ev) => {
          const d = JSON.parse(ev.data);
          addToolCall(d.name, d.arguments);
        });
        es.addEventListener("tool_result", (ev) => {
          const d = JSON.parse(ev.data);
          addToolResult(d.ok, d.text);
        });
        es.addEventListener("step_limit", (ev) => {
          addNote(`reached the ${JSON.parse(ev.data).limit}-step limit for this turn`);
        });
        es.addEventListener("error", (ev) => {
          if (ev.data) addNote(`error: ${JSON.parse(ev.data).message}`);
        });
        es.addEventListener("state", (ev) => renderState(JSON.parse(ev.data)));
        es.addEventListener("done", () => {
          es.close();
          busy = false;
          sendBtn.disabled = false;
          input.focus();
        });
        es.onerror = () => {
          // Connection dropped without a `done`; recover the composer.
          if (busy) { es.close(); busy = false; sendBtn.disabled = false; }
        };
      }

      function renderTags(items) {
        const wrap = el("div", "taglist");
        for (const it of items) wrap.appendChild(el("span", "tag", it));
        return wrap;
      }

      function renderState(state) {
        const specEl = document.getElementById("spec");
        specEl.innerHTML = "";
        const spec = state.spec;
        if (!spec) {
          specEl.appendChild(el("div", "empty", "No spec agreed yet."));
        } else {
          const title = el("div", "kv");
          title.appendChild(el("span", null, "title"));
          title.appendChild(el("span", null, spec.title));
          specEl.appendChild(title);
          const mat = el("div", "kv");
          mat.appendChild(el("span", null, "material"));
          mat.appendChild(el("span", null, spec.material));
          specEl.appendChild(mat);
          if (spec.summary) specEl.appendChild(el("div", null, spec.summary));
          for (const [label, items] of [
            ["requirements", spec.requirements],
            ["constraints", spec.constraints],
            ["interfaces", spec.interfaces],
          ]) {
            if (items && items.length) {
              specEl.appendChild(el("div", "empty", label));
              specEl.appendChild(renderTags(items));
            }
          }
        }

        const partsEl = document.getElementById("parts");
        partsEl.innerHTML = "";
        if (!state.artifacts.length && !state.exports.length) {
          partsEl.appendChild(el("div", "empty", "Nothing built yet."));
        }
        for (const a of state.artifacts) {
          const card = el("div", "part");
          card.appendChild(el("div", "pid", a.id));
          const [x, y, z] = a.bbox_mm.map((v) => v.toFixed(1));
          card.appendChild(el("div", "dims", `${x} × ${y} × ${z} mm`));
          if (a.renders && a.renders.length) {
            const rw = el("div", "renders");
            for (const r of a.renders) {
              const img = el("img");
              img.src = `/files/${r}`;
              img.alt = a.id;
              rw.appendChild(img);
            }
            card.appendChild(rw);
          }
          const links = el("div", "links");
          if (a.stl) links.appendChild(fileLink("STL", a.stl));
          if (a.step) links.appendChild(fileLink("STEP", a.step));
          card.appendChild(links);
          partsEl.appendChild(card);
        }
        if (state.exports.length) {
          partsEl.appendChild(el("div", "empty", "exports"));
          for (const p of state.exports) {
            const row = el("div", "links");
            row.appendChild(fileLink(p.split("/").pop(), p));
            partsEl.appendChild(row);
          }
        }
      }

      function fileLink(label, path) {
        const a = el("a", null, label);
        a.href = `/files/${path}?download=true`;
        return a;
      }

      sendBtn.onclick = send;
      newBtn.onclick = newSession;
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
      });

      newSession();
    </script>
  </body>
</html>
